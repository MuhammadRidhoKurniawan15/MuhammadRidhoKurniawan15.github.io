<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" fill="#f7faff"/><rect x="24" y="24" width="852" height="512" rx="18" fill="white" stroke="#1557d6" stroke-width="3"/><text x="450" y="78" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1557d6">CERTIFICATE OF COMPETENCE</text><text x="450" y="112" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">BNSP · LSP PENS · 24 October 2025</text><text x="60" y="160" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Muhammad Ridho Kurniawan</text><text x="60" y="195" font-family="Arial" font-size="13" fill="#4b5563">Electric Power Distribution</text><text x="60" y="224" font-family="Arial" font-size="13" fill="#4b5563">Consulting Team Head of Low Voltage Network Planning</text><text x="60" y="268" font-family="Arial" font-size="12" fill="#111827">Certificate No. 35103 3113 1 0000049 2025 · Valid for 3 years</text><text x="60" y="310" font-family="Arial" font-size="12" fill="#173b75">Five competency units:</text><text x="75" y="338" font-family="Arial" font-size="11" fill="#4b5563">1. Supervising electric power distribution maintenance</text><text x="75" y="362" font-family="Arial" font-size="11" fill="#4b5563">2. Low-voltage underground cable channel planning</text><text x="75" y="386" font-family="Arial" font-size="11" fill="#4b5563">3. Low-voltage overhead transmission line planning</text><text x="75" y="410" font-family="Arial" font-size="11" fill="#4b5563">4. Low-voltage distribution board (PHB TR) planning</text><text x="75" y="434" font-family="Arial" font-size="11" fill="#4b5563">5. Grounding system planning</text><text x="60" y="482" font-family="Arial" font-size="11" fill="#4b5563">Signed by Ir. Diah Septi Yanaratri, S.ST., M.T. — Chairman, LSP PENS</text></svg>